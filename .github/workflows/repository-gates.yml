name: Repository gates

on:
  pull_request:
  push:
    branches:
      - main
      - integration/**

permissions:
  contents: read

concurrency:
  group: repository-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-gate:
    name: publication-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Test publication gate
        run: python3 scripts/publication_gate_test.py
      - name: Scan repository and event metadata
        run: python3 scripts/publication_gate.py --all

  regression:
    name: regression
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-bookworm@sha256:64154d0babcb1741988719e703419af0382b19953706149f9872fbd0f438efa8 # 16.14-bookworm
        env:
          POSTGRES_DB: swarm_storage_test_gate0
          POSTGRES_USER: swarm_gate0
          POSTGRES_PASSWORD: gate0-local-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swarm_gate0 -d swarm_storage_test_gate0"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://swarm_gate0:gate0-local-only@127.0.0.1:5432/swarm_storage_test_gate0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify PostgreSQL 16 service
        run: |
          client_version="$(psql --version)"
          server_version_num="$(psql "$DATABASE_URL" --no-psqlrc --tuples-only --no-align --command 'SHOW server_version_num')"
          printf 'postgres_client=%s\npostgres_server_version_num=%s\n' "$client_version" "$server_version_num"
          test "$server_version_num" -ge 160000
          test "$server_version_num" -lt 170000
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - name: Activate exact pnpm toolchain
        run: |
          corepack enable
          corepack install
          node_version="$(node --version)"
          corepack_version="$(corepack --version)"
          pnpm_version="$(pnpm --version)"
          printf 'node=%s\ncorepack=%s\npnpm=%s\n' "$node_version" "$corepack_version" "$pnpm_version"
          test "$node_version" = "v24.19.0"
          test "$pnpm_version" = "10.15.1"
      - name: Install TypeScript workspace
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Typecheck TypeScript workspace
        run: pnpm typecheck
      - name: Test TypeScript workspace
        run: pnpm test
      - name: Check package boundaries
        run: pnpm check:boundaries
      - name: Prove package-boundary seeded negative
        run: pnpm check:boundaries:negative
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Compile Python sources
        run: python3 -m py_compile swarm scripts/*.py
      - name: Run serialized regression suite
        run: |
          python3 scripts/anti_stub_probe.py
          python3 scripts/behavior_eval_loop.py
          python3 scripts/behavior_eval_loop.py --manifest docs/evals/scenario-consult-old-evidence.json
          python3 scripts/behavior_eval_loop.py --manifest docs/evals/scenario-chat-task-orchestration.json
          python3 scripts/consult_old_evidence_probe.py
          python3 scripts/dynamic_task_probe.py
          python3 scripts/dynamic_turn_lease_probe.py
          python3 scripts/startup_reconciliation_probe.py
          python3 scripts/resumable_emergent_probe.py
